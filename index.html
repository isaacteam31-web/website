<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ishak Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --bg-2:#f4f6fa;
  --surface:#ffffff;
  --surface-2:#f4f6fb;
  --surface-3:#e9edf6;
  --line:#e3e7f0;
  --text:#10182b;
  --text-dim:#5b6478;
  --text-faint:#98a1b8;
  --accent:#2f5fe0;
  --accent-dark:#1f45b5;
  --accent-2:#b8790f;
  --accent-2-dark:#8f5d09;
  --info:#6d5fd6;
  --danger:#e0435a;
  --on-accent:#ffffff;
  --on-accent-2:#2c1d02;
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:10px;
  --radius-pill:999px;
  --shadow-soft: 0 16px 40px -18px rgba(16,24,40,.18);
  --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 2px 10px -4px rgba(16,24,40,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:radial-gradient(1100px 560px at 85% -10%, #eef2fc 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--text);
  font-family:'Tajawal', sans-serif;
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
}
[dir="ltr"] body{ font-family:'Tajawal', 'Segoe UI', sans-serif; }
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input, textarea, select{font-family:inherit; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 14px; font-size:14.5px; width:100%; transition:.2s border-color, .2s box-shadow;}
input:focus, textarea:focus, select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,95,224,.12);}
::placeholder{color:var(--text-faint);}
h1,h2,h3,h4{font-family:'Almarai', sans-serif; font-weight:800; line-height:1.3;}
a{color:inherit; text-decoration:none;}
.container{max-width:1240px; margin:0 auto; padding:0 24px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--bg-2);}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:10px; border:2px solid var(--bg-2);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important;}
}

/* ---------- Title entrance animation ---------- */
.title-enter{ animation: titleEnter .9s cubic-bezier(.19,1,.22,1) both; }
@keyframes titleEnter{
  from{ opacity:0; transform:translateY(16px); letter-spacing:.3em; }
  to{ opacity:1; transform:translateY(0); letter-spacing:normal; }
}

/* ---------- Header ---------- */
header{
  position:sticky; top:0; z-index:60;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px) saturate(150%);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:20px;}
.brand{display:flex; align-items:center; gap:12px; flex-shrink:0;}
.brand-mark{
  width:44px; height:44px; border-radius:14px;
  background:linear-gradient(145deg, var(--accent), var(--accent-dark));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px -6px rgba(47,95,224,.4);
  font-weight:800; font-size:19px; color:var(--on-accent); font-family:'Almarai',sans-serif;
}
.brand-text h1{font-size:19px; color:var(--text); letter-spacing:.2px;}
.brand-text span{font-size:11.5px; color:var(--text-dim); display:block; margin-top:2px;}
nav.main-nav{display:flex; align-items:center; gap:6px;}
nav.main-nav button{padding:9px 16px; border-radius:var(--radius-pill); font-size:14.5px; color:var(--text-dim); transition:.2s;}
nav.main-nav button.active, nav.main-nav button:hover{background:var(--surface-2); color:var(--text);}
.header-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:42px; height:42px; border-radius:var(--radius-pill); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; position:relative; transition:.2s transform, .2s background;
  border:1px solid var(--line);
}
.icon-btn:hover{background:var(--surface-3); transform:translateY(-2px);}
.icon-btn:active{transform:translateY(0) scale(.94);}
.icon-btn svg{width:19px; height:19px;}
.lang-toggle{
  display:flex; align-items:center; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-pill);
  padding:4px; gap:2px;
}
.lang-toggle button{padding:7px 13px; border-radius:var(--radius-pill); font-size:12.5px; font-weight:700; color:var(--text-dim); transition:.2s;}
.lang-toggle button.active{background:var(--accent); color:var(--on-accent);}
.badge{
  position:absolute; top:-4px; left:-4px; background:var(--accent-2); color:var(--on-accent-2);
  font-size:11px; font-weight:800; min-width:19px; height:19px; border-radius:999px;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
  border:2px solid var(--bg); transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
[dir="ltr"] .badge{ left:auto; right:-4px; }
.badge.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(.4);}60%{transform:scale(1.25);}100%{transform:scale(1);}}

/* ---------- Hero ---------- */
.hero{position:relative; padding:60px 24px 40px; overflow:hidden;}
.hero-inner{max-width:1240px; margin:0 auto; display:grid; grid-template-columns:1.05fr .95fr; gap:40px; align-items:center;}
.hero-brand{font-family:'Almarai',sans-serif; font-weight:800; font-size:14px; letter-spacing:.35em; color:var(--accent); margin-bottom:16px;}
.hero-eyebrow{display:inline-flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); padding:7px 15px; border-radius:var(--radius-pill); font-size:13px; color:var(--accent); margin-bottom:22px;}
.hero-eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 0 0 rgba(184,121,15,.6); animation:pulse-dot 2s infinite;}
@keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(184,121,15,.5);}70%{box-shadow:0 0 0 8px rgba(184,121,15,0);}100%{box-shadow:0 0 0 0 rgba(184,121,15,0);}}
.hero h2{font-size:44px; color:var(--text); margin-bottom:18px; letter-spacing:.2px;}
.hero h2 em{font-style:normal; color:var(--accent);}
.hero p.lead{font-size:16.5px; color:var(--text-dim); max-width:480px; margin-bottom:30px;}
.hero-ctas{display:flex; gap:12px; margin-bottom:38px; flex-wrap:wrap;}
.btn{
  padding:14px 26px; border-radius:var(--radius-pill); font-weight:700; font-size:15px;
  display:inline-flex; align-items:center; gap:8px; transition:.22s transform, .22s box-shadow, .22s background;
  position:relative; overflow:hidden;
}
.btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:var(--on-accent); box-shadow:0 14px 28px -10px rgba(47,95,224,.4);}
.btn-primary:hover{transform:translateY(-3px); box-shadow:0 18px 34px -8px rgba(47,95,224,.5);}
.btn-primary:active{transform:translateY(0) scale(.97);}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--line);}
.btn-ghost:hover{background:var(--surface-3); transform:translateY(-3px);}
.btn-ghost:active{transform:translateY(0) scale(.97);}
.btn-block{width:100%; justify-content:center;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}

.hero-stats{display:flex; gap:34px;}
.stat b{font-size:26px; font-family:'Almarai',sans-serif; color:var(--text); display:block;}
.stat span{font-size:12.5px; color:var(--text-dim);}

.hero-visual{position:relative; height:440px; display:flex; align-items:center; justify-content:center;}
.orb{
  position:absolute; width:340px; height:340px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(47,95,224,.22), rgba(47,95,224,0) 65%);
  filter:blur(10px);
  animation:orb-breathe 5s ease-in-out infinite;
}
@keyframes orb-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.phone-mock{
  position:relative; width:200px; height:410px; border-radius:38px; z-index:3;
  background:linear-gradient(160deg, #1a2440, #0f1730);
  border:6px solid #0a1226;
  box-shadow:0 40px 70px -25px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03) inset;
  opacity:0; transform:translateY(30px) rotate(-8deg) scale(.9);
  animation:phone-in 1s cubic-bezier(.2,.8,.2,1) .15s forwards, phone-float 4.5s ease-in-out 1.2s infinite;
}
@keyframes phone-in{to{opacity:1; transform:translateY(0) rotate(-6deg) scale(1);}}
@keyframes phone-float{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-16px) rotate(-4deg);}}
.phone-mock::before{content:''; position:absolute; top:14px; right:50%; transform:translateX(50%); width:56px; height:6px; border-radius:6px; background:#0a1226;}
.phone-screen{position:absolute; inset:16px 10px; border-radius:26px; background:linear-gradient(155deg, #182a52, #101a35); overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;}
.screen-glow{position:absolute; inset:0; background:radial-gradient(circle at 30% 20%, rgba(91,140,255,.35), transparent 55%);}
.screen-ring{width:64px; height:64px; border-radius:50%; border:3px solid var(--accent); border-top-color:transparent; animation:spin 2.4s linear infinite; opacity:.85;}
@keyframes spin{to{transform:rotate(360deg);}}
.screen-bars{display:flex; gap:5px; align-items:flex-end; height:26px;}
.screen-bars span{width:5px; border-radius:3px; background:var(--accent-2); animation:eq 1.1s ease-in-out infinite;}
.screen-bars span:nth-child(1){height:40%; animation-delay:0s;}
.screen-bars span:nth-child(2){height:100%; animation-delay:.15s;}
.screen-bars span:nth-child(3){height:65%; animation-delay:.3s;}
.screen-bars span:nth-child(4){height:85%; animation-delay:.45s;}
.screen-bars span:nth-child(5){height:50%; animation-delay:.6s;}
@keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

.float-chip{
  position:absolute; display:flex; align-items:center; justify-content:center;
  border-radius:20px; background:var(--surface-2); border:1px solid var(--line);
  box-shadow:var(--shadow-soft); z-index:4; opacity:0;
}
.float-chip svg{width:24px; height:24px;}
.chip-1{width:64px; height:64px; top:6%; right:6%; color:var(--accent-2); animation:chip-in .8s ease .4s forwards, chip-float 5s ease-in-out 1.2s infinite;}
.chip-2{width:56px; height:56px; bottom:14%; right:0%; color:var(--accent); animation:chip-in .8s ease .6s forwards, chip-float 4.2s ease-in-out 1.4s infinite reverse;}
.chip-3{width:58px; height:58px; bottom:4%; left:2%; color:var(--accent-2); animation:chip-in .8s ease .8s forwards, chip-float 4.8s ease-in-out 1.6s infinite;}
.chip-4{width:48px; height:48px; top:16%; left:0%; color:var(--accent); animation:chip-in .8s ease 1s forwards, chip-float 3.8s ease-in-out 1.8s infinite reverse;}
@keyframes chip-in{to{opacity:1;}}
@keyframes chip-float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-14px) rotate(6deg);}}

/* ---------- Section framing ---------- */
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:26px; gap:20px; flex-wrap:wrap;}
.section-head h3{font-size:26px; color:var(--text);}
.section-head p{color:var(--text-dim); font-size:14px; margin-top:6px;}
.section{padding:50px 24px;}

/* ---------- Tabs & search ---------- */
.tabs-row{display:flex; align-items:center; gap:14px; margin-bottom:30px; flex-wrap:wrap; justify-content:space-between;}
.tabs{display:flex; gap:8px; background:var(--surface); padding:6px; border-radius:var(--radius-pill); border:1px solid var(--line);}
.tabs button{padding:10px 20px; border-radius:var(--radius-pill); font-size:14px; color:var(--text-dim); font-weight:500; transition:.25s;}
.tabs button.active{background:var(--accent); color:var(--on-accent); font-weight:700;}
.search-box{position:relative; flex:1; min-width:220px; max-width:340px;}
.search-box input{padding-right:42px;}
[dir="ltr"] .search-box input{padding-right:14px; padding-left:42px;}
.search-box svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--text-faint);}
[dir="ltr"] .search-box svg{right:auto; left:14px;}

/* ---------- Product grid ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:20px;}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  overflow:hidden; transition:.3s transform, .3s box-shadow, .3s border-color; display:flex; flex-direction:column;
  cursor:pointer;
}
.card:hover{transform:translateY(-6px); box-shadow:var(--shadow-soft); border-color:var(--surface-3);}
.card-img{aspect-ratio:1/.95; background:var(--surface-2); position:relative; overflow:hidden;}
.card-img img{width:100%; height:100%; object-fit:cover; transition:.4s transform;}
.card:hover .card-img img{transform:scale(1.06);}
.card-cat-tag{position:absolute; top:12px; right:12px; background:rgba(8,13,24,.65); backdrop-filter:blur(6px); font-size:11px; padding:5px 11px; border-radius:var(--radius-pill); color:var(--text-dim);}
[dir="ltr"] .card-cat-tag{right:auto; left:12px;}
.card-body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
.card-body h4{font-size:15.5px; color:var(--text); font-family:'Tajawal',sans-serif; font-weight:700; min-height:40px;}
.card-tags{display:flex; gap:6px; flex-wrap:wrap;}
.tag-chip{font-size:10.5px; color:var(--accent); background:rgba(47,95,224,.08); padding:3px 9px; border-radius:var(--radius-pill); border:1px solid rgba(47,95,224,.2);}
.card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px;}
.price{font-family:'Almarai',sans-serif; font-weight:800; color:var(--accent-2); font-size:17px;}
.add-btn{
  width:38px; height:38px; border-radius:var(--radius-pill); background:var(--surface-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; transition:.2s;
}
.add-btn:hover{background:var(--accent); color:var(--on-accent); transform:scale(1.08);}
.add-btn svg{width:17px; height:17px;}
.empty-state{grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--text-dim);}
.empty-state svg{width:52px; height:52px; margin:0 auto 16px; color:var(--text-faint);}

/* ---------- Product modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(4,7,15,.72); backdrop-filter:blur(6px); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:.25s opacity;
}
.overlay.show{opacity:1; pointer-events:auto;}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); width:100%; max-width:880px;
  max-height:88vh; overflow:auto; box-shadow:0 30px 70px -20px rgba(16,24,40,.25);
  transform:translateY(24px) scale(.97); opacity:0; transition:.32s cubic-bezier(.2,.9,.25,1);
}
.overlay.show .modal{transform:translateY(0) scale(1); opacity:1;}
.modal-close{position:absolute; top:16px; left:16px; z-index:5;}
[dir="ltr"] .modal-close{left:auto; right:16px;}
.product-modal-grid{display:grid; grid-template-columns:1fr 1fr; gap:0;}
@media(max-width:720px){.product-modal-grid{grid-template-columns:1fr;}}
.gallery{padding:22px; background:var(--surface-2);}
.gallery-main{aspect-ratio:1/1; border-radius:var(--radius-md); overflow:hidden; background:var(--surface-3); margin-bottom:12px; position:relative;}
.gallery-main img{width:100%; height:100%; object-fit:cover;}
.gallery-thumbs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
.gallery-thumbs img{width:58px; height:58px; object-fit:cover; border-radius:10px; border:2px solid transparent; cursor:pointer; opacity:.6; transition:.2s;}
.gallery-thumbs img.active{opacity:1; border-color:var(--accent);}
.pdetail{padding:28px;}
.pdetail-cat{color:var(--accent); font-size:12.5px; margin-bottom:10px;}
.pdetail h2{font-size:23px; margin-bottom:12px; padding-left:30px;}
[dir="ltr"] .pdetail h2{padding-left:0; padding-right:30px;}
.pdetail-price{font-family:'Almarai',sans-serif; font-size:26px; font-weight:800; color:var(--accent-2); margin-bottom:16px;}
.pdetail-desc{color:var(--text-dim); font-size:14.5px; margin-bottom:16px; white-space:pre-line;}
.pdetail-tags{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:22px;}
.qty-row{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
.qty-control{display:flex; align-items:center; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-pill); overflow:hidden;}
.qty-control button{width:38px; height:38px; font-size:18px; color:var(--text);}
.qty-control button:hover{background:var(--surface-3);}
.qty-control span{min-width:34px; text-align:center; font-weight:700;}

/* ---------- Cart drawer ---------- */
.cart-drawer{
  position:fixed; bottom:0; left:0; right:0; z-index:110; max-width:520px; margin:0 auto;
  background:var(--surface); border:1px solid var(--line); border-bottom:none;
  border-radius:26px 26px 0 0; box-shadow:0 -16px 50px -12px rgba(16,24,40,.22);
  transform:translateY(105%); transition:transform .45s cubic-bezier(.19,1,.22,1); max-height:82vh; display:flex; flex-direction:column;
}
.cart-drawer.open{transform:translateY(0);}
.cart-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px 14px; border-bottom:1px solid var(--line);}
.cart-head h3{font-size:18px;}
.cart-items{padding:14px 22px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px;}
.cart-item{display:flex; gap:12px; align-items:center;}
.cart-item img{width:56px; height:56px; border-radius:12px; object-fit:cover; background:var(--surface-2);}
.cart-item-info{flex:1;}
.cart-item-info h5{font-size:14px; margin-bottom:4px;}
.cart-item-info .price{font-size:13.5px;}
.cart-item-qty{display:flex; align-items:center; gap:8px;}
.cart-item-qty button{width:26px; height:26px; border-radius:8px; background:var(--surface-2); font-size:15px;}
.cart-remove{color:var(--danger); font-size:12px; margin-top:4px;}
.cart-empty{text-align:center; padding:40px 10px; color:var(--text-dim);}
.cart-foot{padding:18px 22px 22px; border-top:1px solid var(--line); background:var(--surface);}
.cart-total-row{display:flex; justify-content:space-between; margin-bottom:14px; font-size:15px;}
.cart-total-row b{font-family:'Almarai',sans-serif; color:var(--accent-2); font-size:19px;}
.cart-fab{
  position:fixed; bottom:24px; left:24px; z-index:90;
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:var(--on-accent);
  display:flex; align-items:center; justify-content:center; box-shadow:0 16px 30px -8px rgba(47,95,224,.4);
  transition:.25s transform;
}
[dir="ltr"] .cart-fab{left:auto; right:24px;}
.cart-fab:hover{transform:scale(1.08) translateY(-2px);}
.cart-fab:active{transform:scale(.95);}
.cart-fab svg{width:24px; height:24px;}
.cart-fab .badge{top:-2px; left:-2px;}
[dir="ltr"] .cart-fab .badge{left:auto; right:-2px;}

/* ---------- Checkout form ---------- */
.checkout-form{padding:20px 22px 26px; display:flex; flex-direction:column; gap:14px;}
.form-row{display:flex; flex-direction:column; gap:6px;}
.form-row label{font-size:13px; color:var(--text-dim);}
.form-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

/* ---------- Success animation ---------- */
.success-view{padding:50px 30px; text-align:center;}
.success-check{width:84px; height:84px; border-radius:50%; background:rgba(184,121,15,.1); display:flex; align-items:center; justify-content:center; margin:0 auto 22px; position:relative;}
.success-check svg{width:40px; height:40px; color:var(--accent-2); stroke-dasharray:60; stroke-dashoffset:60; animation:draw-check .5s ease .15s forwards;}
@keyframes draw-check{to{stroke-dashoffset:0;}}
.success-check::after{content:''; position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--accent-2); opacity:0; animation:ring-pop .6s ease .1s forwards;}
@keyframes ring-pop{0%{opacity:.7; transform:scale(.7);}100%{opacity:0; transform:scale(1.35);}}
.success-view h3{font-size:20px; margin-bottom:10px;}
.success-view p{color:var(--text-dim); font-size:14px; margin-bottom:24px;}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line); background:var(--bg-2); padding:44px 24px 26px; margin-top:40px;}
.footer-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:36px; max-width:1240px; margin:0 auto;}
@media(max-width:720px){.footer-grid{grid-template-columns:1fr;}}
.footer-grid h5{font-size:14.5px; margin-bottom:16px; color:var(--text);}

/* ============ Toast ============ */
function toast(msg, type){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity='0'; el.style.transform='translateY(-10px)'; setTimeout(()=>el.remove(),300); }, 2400);
}

/* ============ Init ============ */
async function init(){
  const [p,o,s] = await Promise.all([sGet(K_PRODUCTS), sGet(K_ORDERS), sGet(K_SETTINGS)]);
  if(p && p.length){ PRODUCTS=p; } else { PRODUCTS=seedProducts(); sSet(K_PRODUCTS,PRODUCTS); }
  ORDERS = o || [];
  SETTINGS = s || defaultSettings();
  applyLanguage('ar', true);
  animateCount('statProducts', PRODUCTS.length);
  animateCount('statOrders', ORDERS.filter(x=>x.status==='تم التوصيل'||x.status==='Delivered').length + 120);
}
function animateCount(id, target){
  const el=document.getElementById(id); let cur=0; const step=Math.max(1,Math.ceil(target/40));
  const t=setInterval(()=>{ cur+=step; if(cur>=target){cur=target; clearInterval(t);} el.textContent=cur.toLocaleString('en-US'); },30);
}

/* ============ Language ============ */
function applyLanguage(lang, isInit){

  const html=document.getElementById('htmlRoot');
  html.setAttribute('lang', lang==='ar'?'ar':'en');
  html.setAttribute('dir', lang==='ar'?'rtl':'ltr');

  document.getElementById('heroHeadline').innerHTML = `${t('hero_headline_1')} <em>${t('hero_headline_em')}</em><br>${t('hero_headline_2')}`;
  document.getElementById('heroLead').textContent = sLead() || t('hero_lead');
  document.getElementById('footerPhone').textContent='📞 '+SETTINGS.phone;
  document.getElementById('footerPhone').href='tel:'+SETTINGS.phone;
  document.getElementById('searchInput').placeholder=t('search_placeholder');

document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click', ()=>applyLanguage(b.dataset.lang)));

function money(n){ return Number(n).toLocaleString('en-US')+(currentLang==='ar'?' دج':' DZD'); }

/* ============ Product rendering ============ */
function filteredProducts(){
  return PRODUCTS.filter(p=>{
    const catOk = currentCat==='all' || p.category===currentCat;
    const term = searchTerm.trim().toLowerCase();
    const searchOk = !term || pName(p).toLowerCase().includes(term) || (p.tags||[]).some(tg=>tg.toLowerCase().includes(term));
    return catOk && searchOk;
  });
}
function catLabel(c){ return c==='phones' ? t('cat_phones') : t('cat_accessories'); }

function renderProducts(){
  const grid=document.getElementById('productGrid');
  const list=filteredProducts();
  if(!list.length){
    grid.innerHTML=`<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <p>${t('empty_products')}</p>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(p=>`
    <div class="card" data-id="${p.id}">
      <div class="card-img">
        <img src="${(p.images&&p.images[0])||''}" alt="${escapeHtml(pName(p))}">
        <div class="card-cat-tag">${catLabel(p.category)}</div>
      </div>
      <div class="card-body">
        <h4>${escapeHtml(pName(p))}</h4>
        <div class="card-tags">${(p.tags||[]).slice(0,2).map(tg=>`<span class="tag-chip">${escapeHtml(tg)}</span>`).join('')}</div>
        <div class="card-foot">
          <div class="price">${money(p.price)}</div>
          <button class="add-btn" data-add="${p.id}" title="${t('add_to_cart')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-add]')) return;
      openProduct(card.dataset.id);
    });
  });
  grid.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); addToCart(btn.dataset.add,1); bounceCart(); toast(t('toast_added_cart'),'ok'); });
  });
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ============ Product modal ============ */

document.getElementById('closeProductModal').addEventListener('click', closeProductModal);
document.getElementById('productOverlay').addEventListener('click', (e)=>{ if(e.target.id==='productOverlay') closeProductModal(); });
function closeProductModal(){ document.getElementById('productOverlay').classList.remove('show'); }

/* ============ Cart ============ */
function addToCart(id, qty){
  const existing=cart.find(c=>c.id===id);
  if(existing) existing.qty+=qty; else cart.push({id, qty});
  updateCartBadge();
}
function updateCartBadge(){
  const count=cart.reduce((a,c)=>a+c.qty,0);
  [document.getElementById('cartBadge'), document.getElementById('cartFabBadge')].forEach(b=>{
    b.textContent=count;
    b.style.display=count>0?'flex':'none';
  });
}
function bounceCart(){
  const b=document.getElementById('cartFabBadge');
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  const fab=document.getElementById('cartFab');
  fab.style.transition='.35s cubic-bezier(.34,1.56,.64,1)'; fab.style.transform='scale(1.15)';
  setTimeout(()=>{ fab.style.transform='scale(1)'; },250);
}
function cartTotal(){ return computeItemsTotal(checkoutOverrideItems || cart); }
function computeItemsTotal(items){ return items.reduce((sum,c)=>{ const p=PRODUCTS.find(x=>x.id===c.id); return sum + (p?p.price*c.qty:0); },0); }

function openCart(){
  renderCartDrawer();
  document.getElementById('cartOverlay').classList.add('show');
  document.getElementById('cartDrawer').classList.add('open');
}
function closeCart(){
  document.getElementById('cartOverlay').classList.remove('show');
  document.getElementById('cartDrawer').classList.remove('open');
  checkoutOverrideItems=null;
}
function openDirectOrder(productId, qty){
  checkoutOverrideItems=[{id:productId, qty}];
  closeProductModal();
  document.getElementById('cartOverlay').classList.add('show');
  document.getElementById('cartDrawer').classList.add('open');
  renderCheckoutForm();
}
[document.getElementById('openCartBtn'), document.getElementById('cartFab')].forEach(b=>b.addEventListener('click', openCart));
document.getElementById('cartOverlay').addEventListener('click', closeCart);

function renderCartDrawer(){
  const wrap=document.getElementById('cartDrawerContent');
  if(!cart.length){
    wrap.innerHTML=`
      <div class="cart-head"><h3>${t('cart_title')}</h3><button class="icon-btn" id="cartCloseX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
      <div class="cart-empty">

        <p>${t('cart_empty')}</p>
      </div>`;
    document.getElementById('cartCloseX').addEventListener('click', closeCart);
    return;
  }
  const rows=cart.map(c=>{
    const p=PRODUCTS.find(x=>x.id===c.id); if(!p) return '';
    return `<div class="cart-item" data-id="${c.id}">
      <img src="${(p.images&&p.images[0])||''}" alt="">
      <div class="cart-item-info">
        <h5>${escapeHtml(pName(p))}</h5>
        <div class="price">${money(p.price)}</div>
        <button class="cart-remove" data-rm="${c.id}">${t('remove_label')}</button>
      </div>
      <div class="cart-item-qty">
        <button data-dec="${c.id}">−</button>
        <span>${c.qty}</span>
        <button data-inc="${c.id}">+</button>
      </div>
    </div>`;
  }).join('');
  wrap.innerHTML=`
    <div class="cart-head"><h3>${t('cart_title')} (${cart.reduce((a,c)=>a+c.qty,0)})</h3><button class="icon-btn" id="cartCloseX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
    <div class="cart-items">${rows}</div>
    <div class="cart-foot">
      <div class="cart-total-row"><span>${t('cart_total')}</span><b>${money(cartTotal())}</b></div>
      <button class="btn btn-primary btn-block" id="goCheckoutBtn">${t('checkout_btn')}</button>
    </div>
  `;
  document.getElementById('cartCloseX').addEventListener('click', closeCart);
  wrap.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>{ const c=cart.find(x=>x.id===b.dataset.inc); c.qty++; updateCartBadge(); renderCartDrawer(); }));
  wrap.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>{ const c=cart.find(x=>x.id===b.dataset.dec); c.qty=Math.max(1,c.qty-1); updateCartBadge(); renderCartDrawer(); }));
  wrap.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ cart=cart.filter(x=>x.id!==b.dataset.rm); updateCartBadge(); renderCartDrawer(); }));
  document.getElementById('goCheckoutBtn').addEventListener('click', renderCheckoutForm);
}

function renderCheckoutForm(){
  const wrap=document.getElementById('cartDrawerContent');
  const items = checkoutOverrideItems || cart;
  wrap.innerHTML=`
    <div class="cart-head"><h3>${t('checkout_title')}</h3><button class="icon-btn" id="cartCloseX2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
    <form class="checkout-form" id="checkoutForm">
      <div class="form-row"><label>${t('checkout_name')}</label><input required id="ckName" placeholder="${t('checkout_name_ph')}"></div>
      <div class="form-grid-2">
        <div class="form-row"><label>${t('checkout_phone')}</label><input required id="ckPhone" placeholder="05/06/07 ..." pattern="[0-9]{9,10}"></div>
        <div class="form-row"><label>${t('checkout_wilaya')}</label><input required id="ckWilaya" placeholder="${t('checkout_wilaya_ph')}"></div>
      </div>
      <div class="form-row"><label>${t('checkout_address')}</label><textarea required id="ckAddress" rows="2" placeholder="${t('checkout_address_ph')}"></textarea></div>
      <div class="form-row"><label>${t('checkout_note')}</label><textarea id="ckNote" rows="2" placeholder="${t('checkout_note_ph')}"></textarea></div>
      <div class="cart-total-row" style="margin-top:6px;"><span>${t('checkout_grand_total')}</span><b>${money(computeItemsTotal(items))}</b></div>
      <button type="submit" class="btn btn-primary btn-block">${t('checkout_confirm')}</button>
      ${checkoutOverrideItems ? '' : `<button type="button" class="btn btn-ghost btn-block" id="backToCartBtn">${t('checkout_back')}</button>`}
    </form>
  `;
  document.getElementById('cartCloseX2').addEventListener('click', closeCart);
  const backBtn=document.getElementById('backToCartBtn');
  if(backBtn) backBtn.addEventListener('click', renderCartDrawer);
  document.getElementById('checkoutForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const order={
      id:'ord_'+Date.now(),
      date:new Date().toISOString(),
      customerName:document.getElementById('ckName').value.trim(),
      phone:document.getElementById('ckPhone').value.trim(),
      wilaya:document.getElementById('ckWilaya').value.trim(),
      address:document.getElementById('ckAddress').value.trim(),
      note:document.getElementById('ckNote').value.trim(),
      items:items.map(c=>{ const p=PRODUCTS.find(x=>x.id===c.id); return {productId:c.id, name:p?pName(p):'—', price:p?p.price:0, qty:c.qty}; }),
      total:computeItemsTotal(items),
      status:t('status_new')
    };
    ORDERS.unshift(order);
    await sSet(K_ORDERS, ORDERS);
    if(checkoutOverrideItems){ checkoutOverrideItems=null; } else { cart=[]; updateCartBadge(); }
    renderSuccessView();
  });
}

            ${PRODUCTS.map(p=>`
              <tr>
                <td><div class="td-name-cell"><img class="prod-thumb" src="${(p.images&&p.images[0])||''}"><span>${escapeHtml(pName(p))}</span></div></td>
                <td>${catLabel(p.category)}</td>
                <td>${money(p.price)}</td>
                <td>${(p.tags||[]).join('، ')}</td>
              </tr>
            `).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--text-dim); padding:30px;">${t('no_products_row')}</td></tr>`}
          </tbody>
        </table>
      </div>`;
  } else if(productsSubTab==='add'){
    wrap.innerHTML=`<div id="productFormWrap"></div>`;
    openProductForm(null);
  } else if(productsSubTab==='edit'){
    wrap.innerHTML=`
      <div class="admin-table-wrap" style="margin-bottom:24px;">
        <table>
          <thead><tr><th>${t('th_product')}</th><th>${t('th_category')}</th><th>${t('th_price')}</th><th></th></tr></thead>
          <tbody>
            ${PRODUCTS.map(p=>`
              <tr>
                <td><div class="td-name-cell"><img class="prod-thumb" src="${(p.images&&p.images[0])||''}"><span>${escapeHtml(pName(p))}</span></div></td>
                <td>${catLabel(p.category)}</td>
                <td>${money(p.price)}</td>
                <td><button class="btn btn-ghost" style="padding:8px 16px; font-size:13px;" data-editrow="${p.id}">${t('open_edit')}</button></td>
              </tr>
            `).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--text-dim); padding:30px;">${t('no_products_row')}</td></tr>`}
          </tbody>
        </table>
      </div>
      <p class="small-muted" id="editHint" style="margin-bottom:14px;">${PRODUCTS.length?t('choose_product_edit'):''}</p>
      <div id="productFormWrap"></div>
    `;
    wrap.querySelectorAll('[data-editrow]').forEach(b=>b.addEventListener('click',()=>{
      const hint=document.getElementById('editHint'); if(hint) hint.textContent='';
      openProductForm(b.dataset.editrow);
    }));
  } else if(productsSubTab==='delete'){
    wrap.innerHTML=`
      <p class="small-muted" style="margin-bottom:14px;">${t('choose_product_delete')}</p>
      <div class="admin-table-wrap">
        <table>
          <thead><tr><th>${t('th_product')}</th><th>${t('th_category')}</th><th>${t('th_price')}</th><th></th></tr></thead>
          <tbody id="deleteProductsTbody">
            ${PRODUCTS.map(p=>`
              <tr>
                <td><div class="td-name-cell"><img class="prod-thumb" src="${(p.images&&p.images[0])||''}"><span>${escapeHtml(pName(p))}</span></div></td>
                <td>${catLabel(p.category)}</td>
                <td>${money(p.price)}</td>
                <td><button class="mini-btn" data-del="${p.id}" title="delete"><svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg></button></td>
              </tr>
            `).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--text-dim); padding:30px;">${t('no_products_row')}</td></tr>`}
          </tbody>
        </table>
      </div>
    `;
    wrap.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
      if(!confirm(t('confirm_delete_product'))) return;
      PRODUCTS=PRODUCTS.filter(p=>p.id!==b.dataset.del);
      await sSet(K_PRODUCTS, PRODUCTS);
      renderProductsSubtab(); renderProducts(); renderDashboard();
      toast(t('toast_deleted_product'),'ok');
    }));
  }
}
function openProductForm(id){
  editingProductId=id;
  const raw = id ? PRODUCTS.find(x=>x.id===id) : null;
  const p = raw || {name:{ar:'',en:''}, price:'', category:'phones', description:{ar:'',en:''}, tags:[], images:[]};
  const nameAr = (p.name && p.name.ar) || (typeof p.name==='string'?p.name:'') || '';
  const nameEn = (p.name && p.name.en) || '';
  const descAr = (p.description && p.description.ar) || (typeof p.description==='string'?p.description:'') || '';
  const descEn = (p.description && p.description.en) || '';
  tempImages = (p.images||[]).slice();
  const wrap=document.getElementById('productFormWrap');
  wrap.innerHTML=`
    <div class="admin-form">
      <h4>${id?t('form_title_edit'):t('form_title_new')}</h4>
      <div class="field-grid">
        <div class="form-row"><label>${t('form_name_ar')}</label><input id="fNameAr" value="${escapeAttr(nameAr)}"></div>
        <div class="form-row"><label>${t('form_name_en')}</label><input id="fNameEn" value="${escapeAttr(nameEn)}"></div>
      </div>
      <div class="field-grid">
        <div class="form-row"><label>${t('form_price')}</label><input id="fPrice" type="number" min="0" value="${p.price}"></div>
        <div class="form-row"><label>${t('form_category')}</label>
          <select id="fCategory">
            <option value="phones" ${p.category==='phones'?'selected':''}>${t('cat_phones')}</option>
            <option value="accessories" ${p.category==='accessories'?'selected':''}>${t('cat_accessories')}</option>
          </select>
        </div>
      </div>
      <div class="form-row" style="margin-bottom:16px;"><label>${t('form_tags')}</label><input id="fTags" value="${escapeAttr((p.tags||[]).join('، '))}" placeholder="${t('form_tags_ph')}"></div>
      <div class="field-grid">
        <div class="form-row"><label>${t('form_desc_ar')}</label><textarea id="fDescAr" rows="3">${escapeHtml(descAr)}</textarea></div>
        <div class="form-row"><label>${t('form_desc_en')}</label><textarea id="fDescEn" rows="3">${escapeHtml(descEn)}</textarea></div>
      </div>
      <div class="form-row" style="margin-bottom:8px;"><label>${t('form_images')}</label></div>
      <div class="img-upload-row" id="fImagesRow"></div>
      <input type="file" id="fImgInput" accept="image/*" multiple style="display:none;">
      <div class="admin-form-actions">
        <button class="btn btn-primary" id="saveProductBtn">${t('form_save')}</button>
        <button class="btn btn-ghost" id="cancelProductBtn">${t('form_cancel')}</button>
      </div>
    </div>
  `;
  renderImageThumbs();
  document.getElementById('fImgInput').addEventListener('change', handleImageFiles);
  document.getElementById('cancelProductBtn').addEventListener('click', ()=>{
    if(productsSubTab==='add'){ productsSubTab='view'; renderAdminProducts(); }
    else { wrap.innerHTML=''; }
  });
  document.getElementById('saveProductBtn').addEventListener('click', saveProduct);
  wrap.scrollIntoView({behavior:'smooth', block:'start'});
}
function renderImageThumbs(){
  const row=document.getElementById('fImagesRow');
  row.innerHTML = tempImages.map((im,i)=>`<div class="img-thumb-wrap"><img src="${im}"><div class="rm" data-rmimg="${i}">✕</div></div>`).join('')
    + `<div class="img-add-btn" id="addImgBtn">+</div>`;
  row.querySelectorAll('[data-rmimg]').forEach(b=>b.addEventListener('click',()=>{ tempImages.splice(+b.dataset.rmimg,1); renderImageThumbs(); }));
  document.getElementById('addImgBtn').addEventListener('click', ()=>document.getElementById('fImgInput').click());
}
async function handleImageFiles(e){
  const files=Array.from(e.target.files||[]);
  if(!files.length) return;
  if(!SETTINGS.cloudName || !SETTINGS.uploadPreset){
    toast(t('toast_cloudinary_missing'),'err');
    e.target.value='';
    return;
  }
  toast(t('toast_uploading'),'ok');
  let failed=false;
  for(const file of files){
    try{
      const url = await uploadToCloudinary(file);
      tempImages.push(url);
      renderImageThumbs();
    }catch(err){
      console.error('Cloudinary upload error', err);
      failed=true;
    }
  }
  if(failed) toast(t('toast_upload_failed'),'err'); else toast(t('toast_upload_done'),'ok');
  e.target.value='';
}
async function uploadToCloudinary(file){
  const endpoint = `https://api.cloudinary.com/v1_1/${encodeURIComponent(SETTINGS.cloudName)}/image/upload`;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', SETTINGS.uploadPreset);
  const res = await fetch(endpoint, {method:'POST', body:fd});
  if(!res.ok){ throw new Error('Cloudinary upload failed with status '+res.status); }
  const data = await res.json();
  if(!data.secure_url){ throw new Error('Cloudinary response missing secure_url'); }
  return data.secure_url;
}
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }
async function saveProduct(){
  const nameAr=document.getElementById('fNameAr').value.trim();
  const nameEn=document.getElementById('fNameEn').value.trim();
  const price=parseFloat(document.getElementById('fPrice').value);
  const category=document.getElementById('fCategory').value;
  const descAr=document.getElementById('fDescAr').value.trim();
  const descEn=document.getElementById('fDescEn').value.trim();
  const tags=document.getElementById('fTags').value.split(/[،,]/).map(tg=>tg.trim()).filter(Boolean);
  if(!nameAr || !nameEn || !descAr || !descEn || isNaN(price) || price<=0){ toast(t('toast_fill_required'),'err'); return; }
  const name={ar:nameAr, en:nameEn}, description={ar:descAr, en:descEn};
  if(editingProductId){
    const p=PRODUCTS.find(x=>x.id===editingProductId);
    Object.assign(p,{name, price, category, description, tags, images:tempImages});
  } else {
    PRODUCTS.push({id:'p_'+Date.now(), name, price, category, description, tags, images:tempImages});
  }
  await sSet(K_PRODUCTS, PRODUCTS);
  productsSubTab='view';
  renderAdminProducts(); renderProducts(); renderDashboard();
  toast(t('toast_saved_product'),'ok');
}

/* ============ Admin: orders ============ */
function renderAdminOrders(){
  const el=document.getElementById('panel-orders');
  el.innerHTML=`
    <div class="admin-top"><h2>${t('admin_orders_title')} (${ORDERS.length})</h2><p class="admin-top-sub">${t('admin_orders_sub')}</p></div>
    <div class="admin-table-wrap">
      <table>
        <thead><tr><th></th><th>${t('th_date')}</th><th>${t('th_customer')}</th><th>${t('th_phone')}</th><th>${t('th_wilaya')}</th><th>${t('th_total')}</th><th>${t('th_status')}</th><th></th></tr></thead>
        <tbody id="adminOrdersTbody"></tbody>
      </table>
    </div>
  `;
  const tbody=document.getElementById('adminOrdersTbody');
  if(!ORDERS.length){ tbody.innerHTML=`<tr><td colspan="8" style="text-align:center; color:var(--text-dim); padding:30px;">${t('admin_no_orders')}</td></tr>`; return; }
  const statuses=[t('status_new'),t('status_progress'),t('status_done'),t('status_cancel')];
  tbody.innerHTML = ORDERS.map(o=>`
    <tr>
      <td><button class="mini-btn" data-toggle="${o.id}">${expandedOrderId===o.id?'−':'+'}</button></td>
      <td>${new Date(o.date).toLocaleDateString(currentLang==='ar'?'ar-DZ':'en-GB')}</td>
      <td>${escapeHtml(o.customerName)}</td>
      <td>${escapeHtml(o.phone)}</td>
      <td>${escapeHtml(o.wilaya)}</td>
      <td>${money(o.total)}</td>
      <td>
        <select data-status="${o.id}" style="width:auto; padding:6px 10px; font-size:12.5px;">
          ${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td><button class="mini-btn" data-delorder="${o.id}"><svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg></button></td>
    </tr>
    ${expandedOrderId===o.id?`<tr class="expand-row"><td colspan="8">
      <div class="order-items-list">
        <b style="color:var(--text);">${t('order_address')}:</b> ${escapeHtml(o.address)}<br>
        ${o.note?`<b style="color:var(--text);">${t('order_note')}:</b> ${escapeHtml(o.note)}<br>`:''}
        <b style="color:var(--text);">${t('order_items')}:</b><br>
        ${o.items.map(it=>`— ${escapeHtml(it.name)} × ${it.qty} (${money(it.price*it.qty)})`).join('<br>')}
      </div>
    </td></tr>`:''}
  `).join('');
  tbody.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{ expandedOrderId = expandedOrderId===b.dataset.toggle ? null : b.dataset.toggle; renderAdminOrders(); }));
  tbody.querySelectorAll('[data-status]').forEach(sel=>sel.addEventListener('change', async ()=>{
    const o=ORDERS.find(x=>x.id===sel.dataset.status); o.status=sel.value;
    await sSet(K_ORDERS, ORDERS); renderDashboard(); toast(t('toast_status_updated'),'ok');
  }));
  tbody.querySelectorAll('[data-delorder]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm(t('confirm_delete_order'))) return;
    ORDERS=ORDERS.filter(o=>o.id!==b.dataset.delorder);
    await sSet(K_ORDERS, ORDERS); renderAdminOrders(); renderDashboard();
    toast(t('toast_deleted_order'),'ok');
  }));
}

/* ============ Admin: settings ============ */
function renderAdminSettings(){
  const el=document.getElementById('panel-settings');
  const taglineAr=(SETTINGS.tagline&&SETTINGS.tagline.ar)||''; const taglineEn=(SETTINGS.tagline&&SETTINGS.tagline.en)||'';
  const leadAr=(SETTINGS.lead&&SETTINGS.lead.ar)||''; const leadEn=(SETTINGS.lead&&SETTINGS.lead.en)||'';
  el.innerHTML=`
    <div class="admin-top"><h2>${t('admin_settings_title')}</h2><p class="admin-top-sub">${t('admin_settings_sub')}</p></div>
    <div class="settings-grid">
      <div class="admin-form">
        <h4>${t('settings_store_info')}</h4>
        <div class="form-row" style="margin-bottom:16px;"><label>${t('settings_tagline_ar')}</label><input id="sTaglineAr" value="${escapeAttr(taglineAr)}"></div>
        <div class="form-row" style="margin-bottom:16px;"><label>${t('settings_tagline_en')}</label><input id="sTaglineEn" value="${escapeAttr(taglineEn)}"></div>
        <div class="form-row" style="margin-bottom:16px;"><label>${t('settings_lead_ar')}</label><textarea id="sLeadAr" rows="2">${escapeHtml(leadAr)}</textarea></div>
        <div class="form-row" style="margin-bottom:16px;"><label>${t('settings_lead_en')}</label><textarea id="sLeadEn" rows="2">${escapeHtml(leadEn)}</textarea></div>
        <div class="form-row" style="margin-bottom:16px;"><label>${t('settings_phone')}</label><input id="sPhone" value="${escapeAttr(SETTINGS.phone)}"></div>
        <button class="btn btn-primary" id="saveSettingsBtn">${t('settings_save')}</button>
      </div>
      <div class="admin-form">
        <h4>${t('settings_password_title')}</h4>
        <div class="form-row" style="margin-bottom:16px;"><label>${t('settings_pw_old')}</label><input type="password" id="sPwOld"></div>
        <div class="form-row" style="margin-bottom:16px;"><label>${t('settings_pw_new')}</label><input type="password" id="sPwNew"></div>
        <button class="btn btn-ghost" id="changePwBtn">${t('settings_pw_change')}</button>
        <p class="small-muted" style="margin-top:16px;">${t('settings_pw_note')}</p>
      </div>
      <div class="admin-form" style="grid-column:1 / -1;">
        <h4>${t('settings_cloudinary_title')}</h4>
        <p class="small-muted" style="margin-bottom:16px;">${t('settings_cloudinary_note')}</p>
        <div class="field-grid">
          <div class="form-row"><label>${t('settings_cloud_name')}</label><input id="sCloudName" value="${escapeAttr(SETTINGS.cloudName||'')}" placeholder="my-cloud-name"></div>
          <div class="form-row"><label>${t('settings_upload_preset')}</label><input id="sUploadPreset" value="${escapeAttr(SETTINGS.uploadPreset||'')}" placeholder="my-preset"></div>
        </div>
        <button class="btn btn-primary" id="saveCloudinaryBtn">${t('settings_cloudinary_save')}</button>
      </div>
    </div>
  `;
  document.getElementById('saveCloudinaryBtn').addEventListener('click', async ()=>{
    SETTINGS.cloudName=document.getElementById('sCloudName').value.trim();
    SETTINGS.uploadPreset=document.getElementById('sUploadPreset').value.trim();
    await sSet(K_SETTINGS, SETTINGS);
    toast(t('toast_cloudinary_saved'),'ok');
  });
  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    SETTINGS.tagline={ar:document.getElementById('sTaglineAr').value.trim(), en:document.getElementById('sTaglineEn').value.trim()};
    SETTINGS.lead={ar:document.getElementById('sLeadAr').value.trim(), en:document.getElementById('sLeadEn').value.trim()};
    SETTINGS.phone=document.getElementById('sPhone').value.trim();
    await sSet(K_SETTINGS, SETTINGS);
    applyLanguage(currentLang);
    toast(t('toast_settings_saved'),'ok');
  });
  document.getElementById('changePwBtn').addEventListener('click', async ()=>{
    const oldPw=document.getElementById('sPwOld').value, newPw=document.getElementById('sPwNew').value;
    if(oldPw !== (SETTINGS.adminPassword||'1234')){ toast(t('toast_pw_wrong'),'err'); return; }
    if(!newPw || newPw.length<4){ toast(t('toast_pw_short'),'err'); return; }
    SETTINGS.adminPassword=newPw;
    await sSet(K_SETTINGS, SETTINGS);
    document.getElementById('sPwOld').value=''; document.getElementById('sPwNew').value='';
    toast(t('toast_pw_changed'),'ok');
  });
}

/* ============ Go ============ */
init();
})();
</script>
